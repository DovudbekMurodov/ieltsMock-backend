# /etc/nginx/sites-available/ieltsmock
#
# TLS on a bare IP. Certbot's nginx plugin cannot install an IP certificate, so
# unlike the hostname setup the ssl_certificate lines are written out here by
# hand; deploy/bootstrap-ip.sh substitutes __IP__ when it installs this file.
#
# The certificate comes from Let's Encrypt's "shortlived" profile and lives for
# 160 hours, which is the only profile that issues for an IP at all. Renewal is
# therefore not a monthly background chore but a running dependency: if the
# timer stops for a week the API stops answering.

upstream ieltsmock {
    server unix:/run/ieltsmock/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Renewal re-validates over http, so this has to keep working and has to
    # come before the redirect. A 301 here fails the challenge and the
    # certificate lapses six days later.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/__IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__IP__/privkey.pem;
    # Spelled out rather than included from certbot's own options file: that
    # file only lands on disk when the nginx *installer* plugin runs, and the
    # installer is exactly the part that does not support IP certificates.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No ssl_dhparam: every cipher above is ECDHE, so no DHE parameters are
    # ever negotiated and generating them would only slow the first boot.

    client_max_body_size 26m;   # matches the 25 MB audio ceiling

    # Audio paths are content-addressed, so the bytes behind a URL can never
    # change and the response is safe to cache indefinitely.
    location /media/audio/ {
        alias /srv/ieltsmock/media/audio/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/ieltsmock/media/;
        add_header Cache-Control "public, max-age=3600";
    }

    # WhiteNoise serves STATIC from the app, but letting nginx do it keeps
    # dashboard assets off the Python workers entirely.
    location /static/ {
        alias /srv/ieltsmock/staticfiles/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER reads this; without it Django thinks every
        # request arrived over plain http and redirect-loops.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ieltsmock;
    }
}
