# /etc/nginx/sites-available/ieltsmock
#
# Plain-HTTP variant for a droplet that has no hostname yet. Let's Encrypt will
# not issue a certificate for a bare IP, so there is nothing to serve TLS with.
# Pair it with DJANGO_SECURE_SSL=False in .env; with the flag left on, Django
# redirects every request to https and the loop never terminates.
#
# Replace with deploy/nginx.conf and run certbot as soon as a hostname exists.

upstream ieltsmock {
    server unix:/run/ieltsmock/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # The droplet answers on its IP only, so anything that reaches port 80 is
    # for this app. DJANGO_ALLOWED_HOSTS still pins the Host header Django accepts.
    server_name _;

    # Kept here as well as in the TLS config: this is the config nginx runs
    # under while certbot performs the very first validation, before any
    # certificate exists for the TLS one to reference.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    client_max_body_size 26m;   # matches the 25 MB audio ceiling

    # Audio paths are content-addressed, so the bytes behind a URL can never
    # change and the response is safe to cache indefinitely.
    location /media/audio/ {
        alias /srv/ieltsmock/media/audio/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/ieltsmock/media/;
        add_header Cache-Control "public, max-age=3600";
    }

    # WhiteNoise serves STATIC from the app, but letting nginx do it keeps
    # dashboard assets off the Python workers entirely.
    location /static/ {
        alias /srv/ieltsmock/staticfiles/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # http here, deliberately: SECURE_PROXY_SSL_HEADER reads this, and
        # telling Django the request was https when it was not re-enables the
        # secure-cookie behaviour this config exists to avoid.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ieltsmock;
    }
}
