openapi: 3.0.3
info:
  title: IELTS Mock API
  version: 1.0.0
  description: Content, attempts and progress API for the PrepPath IELTS SPA.
paths:
  /api/v1/attempts/:
    post:
      operationId: startAttempt
      summary: Start (or resume) an attempt
      tags:
      - attempts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAttemptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartAttemptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartAttemptRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
  /api/v1/attempts/{id}/answers/:
    patch:
      operationId: saveAttemptAnswers
      summary: Autosave answers
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - attempts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSaveAnswersRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSaveAnswersRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSaveAnswersRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/attempts/{id}/review/:
    get:
      operationId: reviewAttempt
      summary: Per-question breakdown with correct answers
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - attempts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/attempts/{id}/submit/:
    post:
      operationId: submitAttempt
      summary: Submit and score an attempt
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - attempts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
          description: ''
  /api/v1/attempts/claim/:
    post:
      operationId: claimGuestAttempts
      summary: Attach guest attempts to the signed-in account
      tags:
      - attempts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/attempts/mine/:
    get:
      operationId: listMyAttempts
      summary: This user's attempt history
      tags:
      - attempts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: login
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: logout
      summary: Sign out of this session
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout-all/:
    post:
      operationId: logoutEverywhere
      summary: Revoke every session for this user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedCount'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: getCurrentUser
      summary: The signed-in user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: updateCurrentUser
      summary: Update the signed-in user's profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: refreshToken
      summary: Exchange the refresh cookie for a new access token
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: register
      summary: Create an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/verify/:
    post:
      operationId: verifyAccessToken
      summary: Check an access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidity'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidity'
          description: ''
  /api/v1/events/:
    post:
      operationId: recordEvent
      summary: Record a client-side event
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/speaking/:
    get:
      operationId: listSpeakingTopics
      summary: List published speaking topics
      tags:
      - speaking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/speaking/{slug}/:
    get:
      operationId: getSpeakingTopic
      summary: Fetch one speaking topic
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - speaking
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/tests/:
    get:
      operationId: listTests
      summary: List published tests
      parameters:
      - in: query
        name: skill
        schema:
          type: string
        description: 'Filter by skill: reading or listening.'
      tags:
      - tests
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/tests/{slug}/:
    get:
      operationId: getTest
      description: Returns the materialised public payload. Correct answers are never
        included; scoring happens server-side on submission.
      summary: Fetch one published test
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - tests
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/vocabulary/:
    get:
      operationId: listVocabularySections
      summary: List published vocabulary sections
      tags:
      - vocabulary
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/vocabulary/{slug}/:
    get:
      operationId: getVocabularySection
      summary: Fetch one vocabulary section with its words
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - vocabulary
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/vocabulary/srs/due/:
    get:
      operationId: listDueWords
      summary: Words due for review
      tags:
      - vocabulary
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/vocabulary/srs/import/:
    post:
      operationId: importSrsState
      description: 'Accepts the frontend''s localStorage blob so an existing user''s
        schedule survives the move to server-side storage. Idempotent: re-importing
        keeps whichever due date is later.'
      summary: Import spaced-repetition state from the browser
      tags:
      - vocabulary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/vocabulary/srs/rate/:
    post:
      operationId: rateWord
      summary: Record a review and reschedule the word
      tags:
      - vocabulary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/writing/:
    get:
      operationId: listWritingTasks
      summary: List published writing tasks
      tags:
      - writing
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/writing/{slug}/:
    get:
      operationId: getWritingTask
      description: Model answers are included only when the task's reveal policy allows
        it before submission.
      summary: Fetch one writing task
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - writing
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AnswerEntryRequest:
      type: object
      properties:
        questionId:
          type: integer
        value:
          type: string
          maxLength: 2000
        optionId:
          type: integer
          nullable: true
        timeSpentMs:
          type: integer
          minimum: 0
          nullable: true
      required:
      - questionId
    Attempt:
      type: object
      properties:
        id:
          type: integer
        token:
          type: string
          format: uuid
        testId:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        skill:
          type: string
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        secondsRemaining:
          type: integer
      required:
      - expiresAt
      - id
      - secondsRemaining
      - skill
      - startedAt
      - status
      - testId
      - token
    AttemptResult:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        rawScore:
          type: integer
        rawTotal:
          type: integer
        percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        durationSeconds:
          type: integer
      required:
      - durationSeconds
      - id
      - percent
      - rawScore
      - rawTotal
      - status
    AuthSession:
      type: object
      description: |-
        What a successful register / login / refresh returns.

        The refresh token is deliberately absent: it travels in an httpOnly cookie
        and never reaches JavaScript.
      properties:
        access:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - expiresIn
      - user
    Claim:
      type: object
      properties:
        claimed:
          type: integer
      required:
      - claimed
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EventRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/NameEnum'
        objectType:
          type: string
          maxLength: 32
        objectId:
          type: integer
          nullable: true
        skill:
          type: string
          maxLength: 16
        props:
          type: object
          additionalProperties: {}
      required:
      - name
    ImportRequest:
      type: object
      description: The raw localStorage blob, keyed by "<sectionSlug>::<headword>".
      properties:
        states:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
      required:
      - states
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    NameEnum:
      enum:
      - page.viewed
      - speaking.session_started
      - vocab.section_viewed
      - writing.model_revealed
      - writing.started
      type: string
      description: |-
        * `page.viewed` - page.viewed
        * `speaking.session_started` - speaking.session_started
        * `vocab.section_viewed` - vocab.section_viewed
        * `writing.model_revealed` - writing.model_revealed
        * `writing.started` - writing.started
    PatchedSaveAnswersRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerEntryRequest'
    PatchedUserRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        target_band:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
          nullable: true
        exam_date:
          type: string
          format: date
          nullable: true
        country:
          type: string
          maxLength: 2
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          minLength: 1
          maxLength: 10
    RateRequest:
      type: object
      properties:
        wordId:
          type: integer
        rating:
          $ref: '#/components/schemas/RatingEnum'
      required:
      - rating
      - wordId
    RatingEnum:
      enum:
      - again
      - hard
      - good
      - easy
      type: string
      description: |-
        * `again` - again
        * `hard` - hard
        * `good` - good
        * `easy` - easy
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        target_band:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
          nullable: true
      required:
      - email
      - password
    RevokedCount:
      type: object
      properties:
        revoked:
          type: integer
      required:
      - revoked
    StartAttemptRequest:
      type: object
      properties:
        testId:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - testId
    TokenValidity:
      type: object
      properties:
        valid:
          type: boolean
      required:
      - valid
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        target_band:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
          nullable: true
        exam_date:
          type: string
          format: date
          nullable: true
        country:
          type: string
          maxLength: 2
        timezone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 10
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - is_staff
    VerifyRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
