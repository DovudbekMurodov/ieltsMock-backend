<div class="space-y-3 mt-2">
  {% for q in rows %}
    <div>
      <div class="flex items-start justify-between gap-3 mb-1">
        <a href="{% url 'dashboard:test-edit' q.test_id %}" class="text-sm text-gray-700 hover:text-coral-600 line-clamp-1">
          <span class="text-gray-400">{{ q.test.slug }} Q{{ q.number }}</span> · {{ q.prompt|truncatechars:60 }}
        </a>
        <span class="text-xs font-semibold text-gray-500 shrink-0">{{ q.accuracy|floatformat:0 }}% · {{ q.seen }}</span>
      </div>
      {% load charts %}{% hbar q.correct q.seen %}
    </div>
  {% empty %}
    <p class="text-sm text-gray-400 py-3">{{ empty }}</p>
  {% endfor %}
</div>
